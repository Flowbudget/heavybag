[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "heavybag"
version = "0.1.1"
description = "Punch your code over to the GPU box and watch it run. rsync + ssh, one command, no daemon."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Flowbudget" }]
keywords = ["ssh", "rsync", "remote", "gpu", "machine-learning", "cli", "jobs", "docker", "conda"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Distributed Computing",
  "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/Flowbudget/heavybag"
Repository = "https://github.com/Flowbudget/heavybag"
Issues = "https://github.com/Flowbudget/heavybag/issues"
Changelog = "https://github.com/Flowbudget/heavybag/blob/main/CHANGELOG.md"

[project.scripts]
heavybag = "heavybag.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/heavybag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
